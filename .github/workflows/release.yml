name: Release APK

# Builds the phone app signed with the project's release key and attaches it to a GitHub Release.
#
#   git tag v0.1.0 && git push origin v0.1.0        -> a release with the APK and its SHA-256
#   Actions -> "Release APK" -> Run workflow         -> a signed build kept as a workflow artifact (no release)
#
# It needs two repository secrets, set once by the owner of the key:
#   ANDROID_KEYSTORE_BASE64    the PKCS12 key store, base64 on one line
#   ANDROID_KEYSTORE_PASSWORD  its password (the key password is the same)
# They are never available to pull requests from forks, and this workflow runs only on tags and by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # to create the release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public: the fingerprint of the release certificate. A build signed with anything else is refused.
  EXPECTED_CERT_SHA256: 5e3a657b6ccae6a943e731012f92c4ac958f0fb22ce4666aed024d02760dbff9
  KEY_ALIAS: hermes-surfaces

jobs:
  apk:
    name: Signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.44.0"
          cache: true

      - name: Install the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::the secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD are not set"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.p12"
          {
            echo "storeFile=$RUNNER_TEMP/release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > client/key.properties

      - name: Resolve dependencies
        working-directory: client
        run: flutter pub get

      # The same flags as the build that is installed on the author's phone.
      - name: Build the APK
        working-directory: client
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Check who signed it
        id: apk
        run: |
          apk=client/build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt" | grep -E 'Verifies|certificate SHA-256' || true
          signers=$(grep -c 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" || true)
          found=$(grep 'certificate SHA-256 digest' "$RUNNER_TEMP/certs.txt" | head -1 | sed 's/.*: //')
          if [ "$signers" != "1" ] || [ "$found" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::the APK is not signed by the release key (expected $EXPECTED_CERT_SHA256, found ${found:-none})"
            exit 1
          fi
          name="hermes-miniapps-${GITHUB_REF_NAME//\//-}.apk"
          cp "$apk" "$name"
          sha256sum "$name" > "$name.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12" client/key.properties

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermes-miniapps-apk
          path: |
            ${{ steps.apk.outputs.name }}
            ${{ steps.apk.outputs.name }}.sha256

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.apk.outputs.name }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$NAME" "$NAME.sha256" \
            --title "$GITHUB_REF_NAME" \
            --notes "Signed with the project's release key (certificate SHA-256 ${EXPECTED_CERT_SHA256}). Install over an earlier release with \`adb install -r\` or by opening the file on the phone; the SHA-256 of the file is in the .sha256 asset."
