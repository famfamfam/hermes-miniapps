AuthorName: Sam Russell
AuthorWebSite: https://samrusselltech.net
SourceCode: https://github.com/rusty4444/hermes-android
IssueTracker: https://github.com/rusty4444/hermes-android/issues
Changelog: https://github.com/rusty4444/hermes-android/blob/main/CHANGELOG.md

RepoType: git
Repo: https://github.com/rusty4444/hermes-android

Builds:
  - versionName: '2.0.1'
    versionCode: 2131
    commit: v2.0.1
    sudo:
      - apt-get update
      - apt-get install -y ninja-build libgtk-3-dev
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@3.44.0
    prebuild:
      - export PATH=$$flutter$$/bin:$$PATH$$
      - flutter config --no-analytics
      - flutter pub get
    build:
      - export PATH=$$flutter$$/bin:$$PATH$$
      - flutter build apk --release
    scanignore:
      - build/app/intermediates
      - .dart_tool
      - pubspec.lock

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: '2.0.1'
CurrentVersionCode: 2131
