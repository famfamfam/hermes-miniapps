name: hermes_surfaces_example
description: "Stage 0 test host for hermes_surfaces: connects to a Hermes mobile-surfaces server and runs its mini-apps."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  hermes_surfaces:
    path: ..
  hermes_surfaces_bridge:
    path: ../../hermes_surfaces_bridge
  http: 1.6.0
  path_provider: 2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
