[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mobile-surfaces"
version = "0.0.1"
description = "Hermes Mobile Surfaces plugin (Stage 0 spike)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi", "uvicorn", "mcp==1.30.0", "cryptography"]

[project.scripts]
mobile-surfaces-server = "devserver:main"
ms-admin = "ms_admin:main"

[tool.setuptools]
# The server entry point and the admin CLI are top-level modules (not inside a package).
py-modules = ["devserver", "ms_admin"]

[tool.setuptools.packages.find]
include = ["mobile_surfaces*", "mobile_surfaces_core*"]

[tool.setuptools.package-data]
"mobile_surfaces.install" = ["templates/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
