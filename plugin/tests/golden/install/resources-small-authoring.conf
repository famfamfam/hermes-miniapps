# Managed by `python -m mobile_surfaces.install` (installer schema 1).
# Resource ceilings for this unit alone, profile for small hosts. A process that exceeds MemoryMax is killed (and
# restarted), not the other services of the host. Edit the values with `--memory-max` and friends on
# the next `apply --upgrade`, or add a later drop-in (for example zz-local.conf) to override them.
[Service]
MemoryHigh=320M
MemoryMax=450M
MemorySwapMax=128M
TasksMax=128
CPUQuota=100%
CPUWeight=20
Nice=10
IOWeight=10
